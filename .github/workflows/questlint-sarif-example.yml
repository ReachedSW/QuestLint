name: QuestLint SARIF example

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - run: questlint . --format sarif > questlint.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: questlint.sarif
